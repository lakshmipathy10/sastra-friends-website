// Render cards
const grid = document.getElementById('grid');
friends.forEach(fr=>{{
  const a = document.createElement('a'); a.href = fr.page; a.style.textDecoration='none'; a.style.color='inherit';
  const card = document.createElement('div'); card.className='card';
  const img = document.createElement('img'); img.src=fr.photo; img.className='thumb'; img.onerror=function(){{this.src='photos/placeholder.jpg'}};
  const name = document.createElement('div'); name.className='name'; name.textContent=fr.name;
  const roll = document.createElement('div'); roll.className='roll'; roll.textContent='Roll: '+fr.roll;
  card.appendChild(img); card.appendChild(name); card.appendChild(roll); a.appendChild(card); grid.appendChild(a);
}});

// Search
document.getElementById('search').addEventListener('input', e=>{{
  const val = e.target.value.toLowerCase();
  document.querySelectorAll('#grid a').forEach(a=>{{
    const text = a.textContent.toLowerCase();
    a.style.display = text.includes(val)?'':'none';
  }});
}});

// Slideshow basic
const slides = ['photos/group1.jpg','photos/group2.jpg','photos/group3.jpg','photos/group4.jpg','photos/group5.jpg'];
let idx=0;
setInterval(()=>{ idx=(idx+1)%slides.length; document.getElementById('slideImg').src=slides[idx]; },4000);
